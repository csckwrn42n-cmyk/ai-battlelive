<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>AI 废土大逃杀 - 终极画面渲染端</title>
    <style>
        body {
            background-color: #1a1a1a; color: #eee;
            font-family: 'Courier New', Courier, monospace;
            display: flex; flex-direction: column; align-items: center; padding: 20px; margin: 0;
        }
        h1 { color: #ff9800; text-shadow: 2px 2px 0px #000; margin-top: 0; }
        .container { display: flex; gap: 20px; align-items: flex-start; flex-wrap: wrap; justify-content: center; }
        canvas {
            background-color: #2c3e50; border: 4px solid #555;
            box-shadow: 0 0 15px #000; image-rendering: pixelated;
        }
        .status-box { width: 280px; min-height: 400px; background: #111;
            border: 2px solid #444; padding: 15px; display: flex; flex-direction: column;
        }
        .history-box, .command-panel {
            width: 860px; max-width: 100%; background: #111;
            border: 2px solid #444; padding: 15px; display: flex; flex-direction: column;
            margin-top: 20px;
        }
        .log-title { color: #ff9800; font-weight: bold; border-bottom: 1px solid #333; padding-bottom: 5px; }
        .event-text { color: #00ffcc; font-weight: bold; margin: 10px 0; min-height: 40px; font-size: 14px;}
        .player-list { flex-grow: 1; display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
        .player-row { display: flex; justify-content: space-between; font-size: 13px; }
        .hp-bar-bg { width: 100px; height: 10px; background: #333; border: 1px solid #555; margin-left: 10px; position: relative;}
        .hp-bar-fill { height: 100%; transition: width 0.5s; }
        .history-feed {
            flex-grow: 1; overflow-y: auto; background: #0d1114; border: 1px solid #222;
            padding: 10px; margin-top: 10px; font-size: 12px; line-height: 1.4; color: #ddd;
        }
        .history-item { margin-bottom: 8px; }
        .command-row { display: flex; gap: 10px; align-items: center; margin-top: 10px; }
        .command-input { flex: 1; padding: 10px 12px; border: 1px solid #555; background: #121212; color: #eee; }
        .command-button {
            padding: 10px 16px; border: none; background: #ff9800; color: #111;
            font-weight: bold; cursor: pointer; transition: opacity 0.2s;
        }
        .command-button:hover { opacity: 0.9; }
        .command-hint { color: #aaa; font-size: 13px; margin-top: 8px; }
        .pending-commands { margin-top: 10px; display: grid; gap: 4px; }
        .winner-text { color: #00ff99; font-weight: bold; margin-top: 10px; min-height: 24px; }
        #debugError { color: #ff3333; font-size: 12px; margin-top: 10px; font-weight: bold; }
    </style>
</head>
<body>

    <h1>☢️ AI 废土大逃杀：LIVE 画面 ☢️</h1>
    
    <div class="container">
        <!-- 游戏画面 -->
        <canvas id="gameCanvas" width="550" height="400"></canvas>
        
        <!-- 右侧大模型状态面板 -->
        <div class="status-box">
            <div class="log-title">🛰️ DeepSeek 实时卫星数据</div>
            <div class="event-text" id="worldEvent">正在链接 Python 服务器...</div>
            <div class="log-title">🩸 幸存者健康指标</div>
            <div class="player-list" id="playerList"></div>
            <div id="debugError"></div>
        </div>
    </div>

    <div class="history-box">
        <div class="log-title">📜 直播弹幕日志</div>
        <div class="history-feed" id="actionLog">等待剧本数据...</div>
        <div class="winner-text" id="winNotice"></div>
    </div>

    <div class="command-panel">
        <div class="log-title">💬 实时用户指令</div>
        <div class="command-row">
            <input id="commandInput" class="command-input" placeholder="示例：A attack D 或 B hide" autocomplete="off" />
            <button id="sendCommandBtn" class="command-button" type="button">发送</button>
        </div>
        <div class="command-hint">输入指令驱动剧情：A打B / C躲 / D搜刮 / E救A / B防御  中英文都支持</div>
        <div class="log-title">当前待执行指令</div>
        <div class="pending-commands" id="pendingCommands">暂无待执行指令</div>
    </div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // 固定的 5 个 MBTI 角色状态
    let players = {
        "A": { id: "A", name: "ESTP", x: 120, y: 150, hp: 100, color: "#ff5555", bubble: "", bTime: 0, targetX: 120, targetY: 150, weapon: "拳头", action: "idle", animFrame: 0, scale: 1, flash: 0 },
        "B": { id: "B", name: "INFP", x: 220, y: 250, hp: 100, color: "#5555ff", bubble: "", bTime: 0, targetX: 220, targetY: 250, weapon: "拳头", action: "idle", animFrame: 0, scale: 1, flash: 0 },
        "C": { id: "C", name: "INTJ", x: 350, y: 120, hp: 100, color: "#55ff55", bubble: "", bTime: 0, targetX: 350, targetY: 120, weapon: "拳头", action: "idle", animFrame: 0, scale: 1, flash: 0 },
        "D": { id: "D", name: "ENFP", x: 420, y: 280, hp: 100, color: "#ffff55", bubble: "", bTime: 0, targetX: 420, targetY: 280, weapon: "拳头", action: "idle", animFrame: 0, scale: 1, flash: 0 },
        "E": { id: "E", name: "ISTJ", x: 270, y: 180, hp: 100, color: "#ff55ff", bubble: "", bTime: 0, targetX: 270, targetY: 180, weapon: "拳头", action: "idle", animFrame: 0, scale: 1, flash: 0 }
    };
    
    let particles = [];
    let actionHistory = [];
    let pendingCommands = {};
    let pollHandle = null;
    let lastScriptSig = '';  // 去重：记录上一帧剧本签名

    // 中文动作 → 英文动作映射
    const ACTION_MAP = {
        '打': 'attack', '攻击': 'attack', '攻': 'attack', 'atk': 'attack',
        '搜': 'scavenge', '搜索': 'scavenge', '搜刮': 'scavenge', '捡': 'scavenge', '找': 'scavenge',
        '躲': 'hide', '藏': 'hide', '隐藏': 'hide',
        '跑': 'run', '逃': 'run', '逃跑': 'run', '撤': 'run',
        '守': 'defend', '防': 'defend', '防御': 'defend',
        '停': 'none', '无': 'none', '不': 'none'
    };

    function parseUserCommand(raw) {
        const txt = raw.trim();
        if (!txt) return null;
        // 支持格式: "A 打 B" (有空格) 或 "A打B" (无空格)
        let match = txt.match(/^([A-Ea-e])\s+([^\s]+)\s*([A-Ea-e])?$/);
        let roleId, action, target;
        if (match) {
            roleId = match[1].toUpperCase();
            action = match[2].toLowerCase();
            target = match[3] ? match[3].toUpperCase() : null;
        } else {
            // 无空格紧凑格式: "A打B"
            match = txt.match(/^([A-Ea-e])([^A-Ea-e]+)([A-Ea-e])?$/);
            if (!match) return null;
            roleId = match[1].toUpperCase();
            action = match[2].trim().toLowerCase();
            target = match[3] ? match[3].toUpperCase() : null;
        }
        // 中文 → 英文映射
        const mappedAction = ACTION_MAP[action];
        const allowed = ['attack', 'scavenge', 'hide', 'run', 'defend', 'none'];
        if (mappedAction) {
            action = mappedAction;
        } else if (!allowed.includes(action)) {
            return null;
        }
        return { roleId, action, target };
    }

    function renderPendingCommands() {
        const container = document.getElementById('pendingCommands');
        if (!container) return;
        const lines = Object.values(pendingCommands).map(cmd => {
            return `<div class="history-item">🎯 ${cmd.roleId} ${cmd.action}${cmd.target ? ' ' + cmd.target : ''}</div>`;
        });
        container.innerHTML = lines.length > 0 ? lines.join('') : '<div class="history-item">暂无待执行指令</div>';
    }

    function submitUserCommand(commandText) {
        const errorBox = document.getElementById('debugError');
        const parsed = parseUserCommand(commandText);
        if (!parsed) {
            appendHistoryItems(['❌ 指令格式错误，正确写法：A attack D 或 B hide']);
            errorBox.innerText = '请输入合法指令：角色ID 动作 [目标]';
            return;
        }
        // 记录到前端 pendingCommands（立即视觉反馈）
        pendingCommands[parsed.roleId] = parsed;
        appendHistoryItems([`🎤 用户指令：${parsed.roleId} ${parsed.action}${parsed.target ? ' ' + parsed.target : ''}`]);
        renderPendingCommands();
        document.getElementById('commandInput').value = '';
        errorBox.innerText = '✅ 指令已发送，本轮将优先执行';
        // 发送到后端 /command 端点
        fetch('/command', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                role: parsed.roleId,
                action: parsed.action,
                target: parsed.target || '',
                dialogue: parsed.dialogue || ''
            })
        }).then(r => {
            if (r.ok) {
                errorBox.innerText = '✅ 指令已发送到后端，本轮将优先执行';
            } else {
                errorBox.innerText = '⚠️ 指令已记录在前端，但后端可能未运行';
            }
        }).catch(() => {
            errorBox.innerText = '⚠️ 指令已记录在前端（后端未连接/未运行）';
        });
    }

    function applyCommandOverride(data, id) {
        const override = pendingCommands[id];
        if (!override) return data;
        data = { ...data, action: override.action };
        if (!data.dialogue) {
            data.dialogue = `执行用户指令：${override.action}${override.target ? ' ' + override.target : ''}`;
        }
        if (override.target) {
            data.target = override.target;
        }
        delete pendingCommands[id];
        renderPendingCommands();
        return data;
    }

    function appendHistoryItems(lines) {
        if (!lines || lines.length === 0) return;
        // 去重：过滤掉与最后一条历史完全相同的行
        const newLines = lines.filter(Boolean).filter(l => l !== actionHistory[actionHistory.length - 1]);
        if (newLines.length === 0) return;
        actionHistory = actionHistory.concat(newLines);
        if (actionHistory.length > 50) actionHistory = actionHistory.slice(-50);
        document.getElementById('actionLog').innerHTML = actionHistory
            .map(line => `<div class="history-item">${line}</div>`)
            .join('');
    }

    function renderWinner(winnerName) {
        const notice = document.getElementById('winNotice');
        if (!winnerName) {
            notice.innerText = '';
            return;
        }
        notice.innerText = `🏆 ${winnerName} 获得胜利！直播结束。`;
    }

    function stopPolling() {
        if (pollHandle) {
            clearInterval(pollHandle);
            pollHandle = null;
        }
    }

    function buildSingleLogEntry(id, p, data) {
        const hpChange = data.hp_change || 0;
        const startHp = Math.max(0, p.hp - hpChange);
        let action = data.action || '动向不明';
        if (data.target) {
            action += ` ${data.target}`;
        }
        let weaponText = '';
        if (data.new_weapon && data.new_weapon !== '无' && data.new_weapon !== '不变') {
            weaponText = `，装备了 ${data.new_weapon}`;
        }
        let result = `【${id} ${p.name}】${action}${weaponText}，HP ${startHp} → ${p.hp}`;
        if (data.dialogue) {
            result += `，说:「${data.dialogue}」`;
        }
        if (p.hp <= 0 && startHp > 0) {
            result += '，已经被淘汰';
        }
        return result;
    }

    function renderScript(script, isSample = false) {
        // 去重：如果剧本内容没变（同一轮），跳过日志追加
        const sig = JSON.stringify(script);
        if (sig === lastScriptSig) {
            // 只更新血量/状态，不追加日志
            if (script.characters) {
                for (let id in script.characters) {
                    if (!players[id]) continue;
                    let p = players[id];
                    let data = script.characters[id];
                    if (data.hp_change !== undefined) {
                        p.hp = Math.max(0, p.hp + data.hp_change);
                    }
                }
                updateSidebarUI();
            }
            return;
        }
        lastScriptSig = sig;

        if (script.narrative) {
            // 指令驱动的新叙事文本
            document.getElementById('worldEvent').innerText = script.narrative;
            appendHistoryItems([`📖 ${script.narrative}`]);
        } else if (script.world_event) {
            document.getElementById('worldEvent').innerText = script.world_event;
            if (script.idle) {
                // 待机状态不追加到历史日志，避免刷屏
                // 只更新世界事件文本
            } else {
                appendHistoryItems([`🌍 ${script.world_event}`]);
            }
        }

        const chars = script.characters;
        if (!chars) return;

        let currentLogs = [];
        for (let id in chars) {
            if (!players[id]) continue;
            let p = players[id];
            let data = applyCommandOverride(chars[id], id);
            let previousHp = p.hp;

            // 记录动作用于动画
            if (data.action) {
                p.action = data.action;
                p.animFrame = 0;
            }
            // 扣血时闪白
            if (data.hp_change !== undefined) {
                p.hp = Math.max(0, p.hp + data.hp_change);
                if (data.hp_change < 0) {
                    p.flash = 10;  // 闪白持续帧数
                }
            }
            if (data.new_weapon && data.new_weapon !== '无' && data.new_weapon !== '不变') {
                p.weapon = data.new_weapon;
            }
            if (data.dialogue && data.dialogue !== '...') {
                p.bubble = data.dialogue;
                p.bTime = 120;
            }
            if (p.hp <= 0 || data.action === 'dead') {
                p.hp = 0;
            } else if (data.action === 'attack') {
                let targets = [];
                if (data.target && players[data.target] && players[data.target].hp > 0 && data.target !== id) {
                    targets = [players[data.target]];
                } else {
                    targets = Object.values(players).filter(x => x.id !== id && x.hp > 0);
                }
                if (targets.length > 0) {
                    let t = targets[Math.floor(Math.random() * targets.length)];
                    p.targetX = t.x; p.targetY = t.y;
                    createParticles(t.x, t.y, p.color);
                }
            } else if (['hide', 'scavenge', 'run', 'defend'].includes(data.action)) {
                p.targetX = Math.random() * 400 + 50;
                p.targetY = Math.random() * 260 + 50;
            }

            currentLogs.push(buildSingleLogEntry(id, p, data));
        }

        if (script.battle_log && Array.isArray(script.battle_log)) {
            appendHistoryItems(script.battle_log.map(line => `🧾 ${line}`));
        } else {
            appendHistoryItems(currentLogs);
        }

        updateSidebarUI();

        const alive = Object.values(players).filter(p => p.hp > 0);
        if (alive.length <= 1) {
            const winnerName = alive.length === 1 ? `${alive[0].id} ${alive[0].name}` : '无人幸存';
            renderWinner(winnerName);
            stopPolling();
            if (!script.game_over) {
                appendHistoryItems(['⚠️ 检测到决赛结果，但后端未标记 game_over，已停止轮询。']);
            }
        }
    }

    async function fetchLatestScript() {
        try {
            const scriptUrl = new URL('game_script.json', window.location.href);
            let response = await fetch(`${scriptUrl.href}?nocache=${Math.random()}`, { cache: 'no-store' });

            if (!response.ok) {
                const sampleUrl = new URL('game_script.sample.json', window.location.href);
                const sampleResponse = await fetch(`${sampleUrl.href}?nocache=${Math.random()}`, { cache: 'no-store' });
                if (sampleResponse.ok) {
                    document.getElementById('debugError').innerText = '⚠️ 未找到后端实时数据，已加载静态示例剧本。';
                    const script = await sampleResponse.json();
                    renderScript(script, true);
                    return;
                }

                const hint = window.location.protocol === 'file:'
                    ? '请使用本地服务器打开页面，例如：python3 -m http.server'
                    : '请确认服务器在正确目录下运行';
                document.getElementById('debugError').innerText = `❌ 找不到 game_script.json，${hint}。`;
                return;
            }

            const script = await response.json();
            document.getElementById('debugError').innerText = '✅ 卫星信号稳定，剧本同步中...';
            renderScript(script, false);
        } catch (e) {
            let message = e.message || String(e);
            if (window.location.protocol === 'file:') {
                message = '本地打开模式可能被浏览器拦截，请改用本地服务器，如：python3 -m http.server';
            }
            document.getElementById('debugError').innerText = `❌ 解析 JSON 失败，可能文件正在被写入或加载失败: ${message}`;
        }
    }

    function updateSidebarUI() {
        const listContainer = document.getElementById('playerList');
        listContainer.innerHTML = '';
        for (let id in players) {
            let p = players[id];
            let row = document.createElement('div');
            row.className = 'player-row';
            let statusText = p.hp <= 0 ? '💀 死亡' : `HP: ${p.hp} [${p.weapon}]`;
            row.innerHTML = `
                <span style="color:${p.color}; text-decoration: ${p.hp<=0?'line-through':'none'}">${p.name} (${statusText})</span>
                <div class="hp-bar-bg"><div class="hp-bar-fill" style="width: ${p.hp}%; background:${p.hp > 30 ? '#0f0':'#f00'}"></div></div>
            `;
            listContainer.appendChild(row);
        }
    }

    function update() {
        for (let id in players) {
            let p = players[id];
            if (p.hp <= 0) continue;
            
            // 移动
            p.x += (p.targetX - p.x) * 0.05;
            p.y += (p.targetY - p.y) * 0.05;
            
            // 动画帧计数
            p.animFrame++;
            
            // 闪白衰减
            if (p.flash > 0) p.flash--;
            
            // 根据动作做特殊动画
            switch (p.action) {
                case 'attack':
                    // 攻击时向前突进再回弹
                    if (p.animFrame < 10) {
                        p.scale = 1 + 0.15 * Math.sin(p.animFrame * 0.5);
                    } else {
                        p.scale = 1;
                        if (p.animFrame > 30) p.action = 'idle';
                    }
                    break;
                case 'hurt':
                    p.scale = 1 + 0.1 * Math.sin(p.animFrame * 0.8);
                    if (p.animFrame > 15) {
                        p.action = 'idle';
                        p.scale = 1;
                    }
                    break;
                case 'run':
                    // 跑动时身体前倾抖动
                    p.scale = 1 + 0.05 * Math.sin(p.animFrame * 0.3);
                    break;
                case 'hide':
                    // 蹲下缩小
                    p.scale = Math.max(0.6, 1 - p.animFrame * 0.02);
                    break;
                case 'scavenge':
                    // 弯腰搜索，上下晃动
                    p.scale = 1 + 0.08 * Math.sin(p.animFrame * 0.15);
                    break;
                case 'defend':
                    // 防御姿态，轻微缩小
                    p.scale = 0.85 + 0.03 * Math.sin(p.animFrame * 0.1);
                    break;
                default:
                    // idle: 呼吸浮动
                    p.scale = 1 + 0.04 * Math.sin(p.animFrame * 0.03);
                    break;
            }
        }
        for (let i = particles.length - 1; i >= 0; i--) {
            let pt = particles[i];
            pt.x += pt.vx; pt.y += pt.vy; pt.life--;
            if (pt.life <= 0) particles.splice(i, 1);
        }
    }

    function draw() {
        ctx.fillStyle = '#2c3e50';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // 绘制地面网格
        ctx.strokeStyle = 'rgba(255,255,255,0.05)';
        ctx.lineWidth = 1;
        for (let i = 0; i < canvas.width; i += 40) {
            ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
        }
        for (let i = 0; i < canvas.height; i += 40) {
            ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(canvas.width, i); ctx.stroke();
        }

        for (let id in players) {
            let p = players[id];
            let s = p.scale || 1;
            let cx = p.x, cy = p.y;

            if (p.hp <= 0) {
                // 死亡：画一个倒下的X
                ctx.save();
                ctx.translate(cx, cy);
                ctx.strokeStyle = '#7f8c8d';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(-10, -8); ctx.lineTo(10, 8);
                ctx.moveTo(10, -8); ctx.lineTo(-10, 8);
                ctx.stroke();
                ctx.restore();
                ctx.fillStyle = '#7f8c8d';
                ctx.font = '10px Courier';
                ctx.fillText(p.name, cx - 8, cy - 15);
                continue;
            }

            ctx.save();
            ctx.translate(cx, cy);
            ctx.scale(s, s);

            // 闪白效果
            if (p.flash > 0) {
                ctx.globalAlpha = 0.6 + 0.4 * (p.flash / 10);
            }

            const w = 20, h = 20;
            const hw = w / 2, hh = h / 2;

            // 根据动作画不同形状
            switch (p.action) {
                case 'attack':
                    // 攻击：菱形 + 突刺
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.moveTo(0, -hh);
                    ctx.lineTo(hw + 3, 0);
                    ctx.lineTo(0, hh);
                    ctx.lineTo(-hw - 3, 0);
                    ctx.closePath();
                    ctx.fill();
                    // 拳头
                    ctx.fillStyle = '#fff';
                    ctx.beginPath();
                    ctx.arc(hw + 5, 0, 4, 0, Math.PI * 2);
                    ctx.fill();
                    break;

                case 'defend':
                    // 防御：圆角方框 + 盾牌
                    ctx.fillStyle = p.color;
                    roundRect(ctx, -hw, -hh, w, h, 5);
                    ctx.fill();
                    ctx.strokeStyle = '#fff';
                    ctx.lineWidth = 2;
                    roundRect(ctx, -hw - 3, -hh - 3, w + 6, h + 6, 6);
                    ctx.stroke();
                    break;

                case 'hide':
                    // 隐藏：半透明 + 蹲下形状
                    ctx.globalAlpha = 0.5;
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.ellipse(0, 3, hw, hh * 0.7, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.globalAlpha = 1;
                    break;

                case 'run':
                    // 跑步：倾斜的动态方块
                    ctx.fillStyle = p.color;
                    ctx.save();
                    ctx.rotate(0.15 * Math.sin(p.animFrame * 0.2));
                    ctx.fillRect(-hw + 2, -hh, w - 4, h);
                    ctx.restore();
                    // 脚
                    ctx.fillStyle = '#ddd';
                    let legOffset = 3 * Math.sin(p.animFrame * 0.3);
                    ctx.fillRect(-hw + 2, hh - 2, 5, 4 + legOffset);
                    ctx.fillRect(hw - 7, hh - 2, 5, 4 - legOffset);
                    break;

                case 'scavenge':
                    // 搜索：弯腰
                    ctx.fillStyle = p.color;
                    ctx.fillRect(-hw, -hh, w, h);
                    // 弯腰的手臂
                    ctx.strokeStyle = p.color;
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.moveTo(0, 4);
                    ctx.lineTo(12, 10 + 3 * Math.sin(p.animFrame * 0.1));
                    ctx.stroke();
                    break;

                case 'hurt':
                    // 受伤：闪白 + 颤抖
                    ctx.fillStyle = p.flash > 0 ? '#fff' : p.color;
                    let shakeX = (Math.random() - 0.5) * 4;
                    let shakeY = (Math.random() - 0.5) * 4;
                    ctx.fillRect(-hw + shakeX, -hh + shakeY, w, h);
                    // 裂痕
                    ctx.strokeStyle = '#f00';
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.moveTo(-5, -5); ctx.lineTo(3, 3);
                    ctx.moveTo(5, -3); ctx.lineTo(-2, 5);
                    ctx.stroke();
                    break;

                default:
                    // idle: 普通方块 + 呼吸动画
                    ctx.fillStyle = p.color;
                    let breath = 1 + 0.03 * Math.sin(p.animFrame * 0.03);
                    ctx.save();
                    ctx.scale(breath, 1);
                    roundRect(ctx, -hw, -hh, w, h, 3);
                    ctx.fill();
                    ctx.restore();
                    // 眼睛
                    ctx.fillStyle = '#fff';
                    ctx.fillRect(-5, -4, 4, 4);
                    ctx.fillRect(3, -4, 4, 4);
                    ctx.fillStyle = '#000';
                    ctx.fillRect(-4, -3, 2, 2);
                    ctx.fillRect(4, -3, 2, 2);
                    break;
            }

            ctx.restore();

            // 名字标签
            ctx.fillStyle = '#fff';
            ctx.font = '10px Courier';
            ctx.textAlign = 'center';
            ctx.fillText(p.name, cx, cy - 22);

            // 血条
            let barW = 30, barH = 4;
            ctx.fillStyle = '#333';
            ctx.fillRect(cx - barW / 2, cy + 14, barW, barH);
            ctx.fillStyle = p.hp > 50 ? '#0f0' : p.hp > 25 ? '#ff0' : '#f00';
            ctx.fillRect(cx - barW / 2, cy + 14, barW * (p.hp / 100), barH);

            // 武器标签
            if (p.weapon && p.weapon !== '拳头') {
                ctx.fillStyle = '#aaa';
                ctx.font = '8px Courier';
                ctx.fillText(p.weapon, cx, cy + 26);
            }

            // 对话框
            if (p.bTime > 0 && p.bubble) {
                ctx.font = '12px "Microsoft YaHei", sans-serif';
                ctx.textAlign = 'center';
                let txtW = ctx.measureText(p.bubble).width;
                ctx.fillStyle = 'rgba(255,255,255,0.95)';
                roundRect(ctx, cx - txtW / 2 - 6, cy - 52, txtW + 12, 22, 4);
                ctx.fill();
                ctx.fillStyle = '#000';
                ctx.fillText(p.bubble, cx, cy - 36);
                p.bTime--;
            }
        }

        // 粒子
        particles.forEach(pt => {
            ctx.fillStyle = pt.color;
            ctx.globalAlpha = pt.life / 20;
            ctx.fillRect(pt.x, pt.y, 4, 4);
            ctx.globalAlpha = 1;
        });

        ctx.textAlign = 'start';
    }

    function roundRect(ctx, x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.lineTo(x + w - r, y);
        ctx.quadraticCurveTo(x + w, y, x + w, y + r);
        ctx.lineTo(x + w, y + h - r);
        ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        ctx.lineTo(x + r, y + h);
        ctx.quadraticCurveTo(x, y + h, x, y + h - r);
        ctx.lineTo(x, y + r);
        ctx.quadraticCurveTo(x, y, x + r, y);
        ctx.closePath();
    }

    function createParticles(x, y, color) {
        for (let i = 0; i < 10; i++) {
            particles.push({ x: x, y: y, vx: (Math.random() - 0.5) * 8, vy: (Math.random() - 0.5) * 8, life: 20, color: color });
        }
    }

    function loop() { update(); draw(); requestAnimationFrame(loop); }

    document.getElementById('sendCommandBtn').addEventListener('click', () => {
        submitUserCommand(document.getElementById('commandInput').value);
    });
    document.getElementById('commandInput').addEventListener('keydown', (event) => {
        if (event.key === 'Enter') {
            submitUserCommand(event.target.value);
        }
    });

    renderPendingCommands();
    pollHandle = setInterval(fetchLatestScript, 5000);
    fetchLatestScript();
    updateSidebarUI();
    loop();
</script>
</body>
</html>
